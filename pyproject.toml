[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "latency-compensated-detection"
version = "0.1.0"
description = "Causal ego-motion and object-motion compensation for delayed detections"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26", "pandas>=2.0", "scipy>=1.10", "scikit-learn>=1.3", "pyarrow>=12", "opencv-python>=4.8"]

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
