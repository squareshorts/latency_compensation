[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "latency-compensated-detection"
version = "1.0.0"
description = "Causal ego-motion and object-motion compensation for delayed detections"
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.10"
authors = [{name = "Antonio Pereira Jr."}]
dependencies = [
  "numpy>=1.26",
  "pandas>=2.0",
  "scipy>=1.10",
  "scikit-learn>=1.3",
  "pyarrow>=12",
  "opencv-python>=4.8",
  "matplotlib>=3.7",
  "joblib>=1.3"
]

[project.optional-dependencies]
test = ["pytest>=8"]
inference = ["torch>=2.3", "ultralytics>=8.4", "av2", "nuscenes-devkit>=1.1"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
